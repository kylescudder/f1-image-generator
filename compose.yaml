name: paddock
services:
  web:
    image: ${PADDOCK_IMAGE:?Select an attested release digest using deploy/herman-deploy.sh}
    user: "501:20"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: https://paddock.thescudders.org
      DATA_DIR: /app/data
      DATABASE_URL: postgres://paddock_runtime@postgres:5432/paddock
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      TZ: Europe/London
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBY_URL: ${EMBY_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
    volumes:
      - ${PADDOCK_DATA_DIR:-./data}:/app/data
    secrets:
      - database_password
    networks:
      platform-web:
        aliases: [paddock]
      platform-db: {}
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "const r = await fetch('http://127.0.0.1:3000/api/health'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
secrets:
  database_password:
    file: ../../projects/paddock/runtime-password
networks:
  platform-web:
    external: true
  platform-db:
    external: true
